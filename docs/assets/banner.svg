<style>
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.12)}96%{transform:scaleY(1)}}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.sw{animation:sw 6s linear infinite}
@keyframes sw{0%{transform:translateX(-500px)}100%{transform:translateX(1400px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.word rect{animation:flick 7s infinite}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.55}98%{opacity:1}99%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.ch,.mv{animation:none!important;opacity:1}.bob,.eye,.cur,.sw,.pulse,.word rect{animation:none}}
@keyframes t0{0%,9.99%{opacity:0}10.00%,90.00%{opacity:1}90.01%,100%{opacity:0}}.k0{animation:t0 6s infinite}
@keyframes t1{0%,13.99%{opacity:0}14.00%,90.00%{opacity:1}90.01%,100%{opacity:0}}.k1{animation:t1 6s infinite}
@keyframes t2{0%,17.99%{opacity:0}18.00%,90.00%{opacity:1}90.01%,100%{opacity:0}}.k2{animation:t2 6s infinite}
@keyframes t3{0%,21.99%{opacity:0}22.00%,90.00%{opacity:1}90.01%,100%{opacity:0}}.k3{animation:t3 6s infinite}
@keyframes t4{0%,25.99%{opacity:0}26.00%,90.00%{opacity:1}90.01%,100%{opacity:0}}.k4{animation:t4 6s infinite}
@keyframes t5{0%,29.99%{opacity:0}30.00%,90.00%{opacity:1}90.01%,100%{opacity:0}}.k5{animation:t5 6s infinite}
@keyframes mv{0%{transform:translateX(0)}9.99%{transform:translateX(0.0px)}10.00%{transform:translateX(15.6px)}13.99%{transform:translateX(15.6px)}14.00%{transform:translateX(31.2px)}17.99%{transform:translateX(31.2px)}18.00%{transform:translateX(46.8px)}21.99%{transform:translateX(46.8px)}22.00%{transform:translateX(62.4px)}25.99%{transform:translateX(62.4px)}26.00%{transform:translateX(78.0px)}29.99%{transform:translateX(78.0px)}30.00%{transform:translateX(93.6px)}90.00%{transform:translateX(93.6px)}90.01%,100%{transform:translateX(0)}}.mv{animation:mv 6s infinite}
</style>
