<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Health — AI coding assistant for the Windows console">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b2ff59"/><stop offset=".55" stop-color="#39ff88"/><stop offset="1" stop-color="#00c853"/></linearGradient>
<linearGradient id="gw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b2ff59"/><stop offset=".5" stop-color="#39ff88"/><stop offset="1" stop-color="#00c853"/></linearGradient>
