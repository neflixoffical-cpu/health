health-skills = { workspace = true }
health-local = { workspace = true }
health-agent = { workspace = true }
health-ui = { workspace = true }
health-panels-a = { workspace = true }
health-panels-b = { workspace = true }
health-tui = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[build-dependencies]
health-icon = { workspace = true, features = ["build"] }
