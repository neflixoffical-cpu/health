[package]
name = "health-setup"
description = "Health installer: per-user install, PATH registration, shortcuts, uninstaller"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "health-setup"
path = "src/main.rs"

[dependencies]
health-core = { workspace = true }
health-theme = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
anyhow = { workspace = true }
miniz_oxide = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true }

[build-dependencies]
miniz_oxide = { workspace = true }
health-icon = { workspace = true, features = ["build"] }
